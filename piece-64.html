<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untitled, 2020 — Piotr Szlachta</title>
<link rel="stylesheet" href="styles.css">
<style>
  header { transform: translateY(0); }

  .piece-nav {
    padding: 6.5rem 5vw 0;
  }

  .piece {
    padding: 0 5vw 6rem;
  }

  .piece-image {
    max-width: 407px;
    margin: 0 auto 3rem;
  }

  .piece-header,
  .piece-details {
    max-width: 407px;
    margin-left: auto;
    margin-right: auto;
  }

  .piece-image img {
    width: 100%;
    height: auto;
    display: block;
    cursor: zoom-in;
    box-shadow: 0 24px 60px rgba(40, 35, 25, 0.15);
    transition: box-shadow 0.3s ease;
  }

  .piece-image img:hover {
    box-shadow: 0 30px 70px rgba(40, 35, 25, 0.22);
  }

  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 5vw;
    background: rgba(20, 18, 15, 0.92);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .lightbox.open {
    opacity: 1;
    pointer-events: auto;
  }

  .lightbox img {
    max-width: 100%;
    max-height: 100%;
    cursor: zoom-out;
    box-shadow: 0 30px 90px rgba(0, 0, 0, 0.5);
  }

  .piece-header {
    text-align: center;
    margin-bottom: 3.5rem;
  }

  .piece-header .divider {
    margin-left: auto;
    margin-right: auto;
  }

  .back-link {
    display: inline-block;
    margin-bottom: 2.5rem;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fg-dim);
    text-decoration: none;
  }

  .back-link:hover { color: var(--accent); }

  .eyebrow {
    font-size: 0.72rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 1rem;
  }

  .piece-header h1 {
    font-family: var(--font-display);
    font-size: clamp(1.8rem, 3.5vw, 2.4rem);
    font-weight: 500;
    letter-spacing: 0.02em;
    margin-bottom: 1rem;
  }

  .meta {
    color: var(--fg-dim);
    font-size: 0.85rem;
    letter-spacing: 0.02em;
    margin-bottom: 2.5rem;
  }

  .divider {
    width: 48px;
    height: 1px;
    background: var(--border);
    margin-bottom: 2.5rem;
  }

  .description p {
    color: var(--fg-dim);
    margin-bottom: 1.4rem;
    font-size: 1.05rem;
  }

  .statement-excerpt {
    margin-top: 2.8rem;
    padding-left: 1.2rem;
    border-left: 2px solid var(--border);
  }

  .statement-excerpt p {
    color: var(--fg-dim);
    margin-bottom: 0.6rem;
    font-size: 1rem;
  }

  .statement-excerpt span {
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    color: var(--fg-dim);
    text-transform: uppercase;
    opacity: 0.7;
  }

  .cta {
    display: inline-block;
    margin-top: 3rem;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--fg);
    text-decoration: none;
    border-bottom: 1px solid var(--fg);
    padding-bottom: 2px;
  }

  .cta:hover { color: var(--accent); border-color: var(--accent); }

  @media (max-width: 900px) {
    .piece-nav { padding-top: 5.5rem; }
  }

  @media (max-width: 480px) {
    .piece, .piece-nav {
      padding-left: 30px;
      padding-right: 30px;
    }
    .piece-header h1 {
      font-size: 1.5rem;
    }
  }

  .photoset {
    max-width: 407px;
    margin: 2.5rem auto 0;
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    justify-content: center;
  }

  .photoset img {
    height: 130px;
    width: auto;
    max-width: 100%;
    display: block;
    cursor: zoom-in;
    border: 1px solid var(--border);
    transition: opacity 0.2s ease;
  }

  .photoset img:hover {
    opacity: 0.9;
  }

  .photoset-wrap {
    position: relative;
    max-width: 407px;
    margin: 2.5rem auto 0;
  }

  .photoset-wrap .photoset {
    margin: 0;
    max-width: none;
    flex-wrap: nowrap;
    justify-content: flex-start;
    overflow-x: auto;
    scroll-behavior: smooth;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }

  .photoset-wrap .photoset::-webkit-scrollbar {
    display: none;
  }

  .photoset-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    width: 2rem;
    height: 2rem;
    background: none;
    border: none;
    color: var(--fg-dim);
    cursor: pointer;
    padding: 0;
    z-index: 2;
  }

  .photoset-nav:hover {
    color: var(--accent);
  }

  .photoset-nav.prev {
    right: 100%;
    margin-right: 0.3rem;
  }

  .photoset-nav.next {
    left: 100%;
    margin-left: 0.3rem;
  }

  @media (max-width: 720px) {
    .photoset-nav {
      display: none;
    }
  }

  .lightbox-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: rgba(255,255,255,0.85);
    cursor: pointer;
    padding: 0.6rem;
    z-index: 60;
  }

  .lightbox-nav:hover {
    color: #fff;
  }

  .lightbox-nav.prev {
    left: 1rem;
  }

  .lightbox-nav.next {
    right: 1rem;
  }
</style>
</head>
<body>

<header class="visible">
  <a class="logo" href="index.html">Piotr Szlachta</a>
  <nav>
    <a href="paintings.html"><span>Paintings</span><svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg></a>
    <a href="posters.html"><span>Posters</span><svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg></a>
    <a href="street-art.html"><span>Street Art</span><svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg></a>
    <a href="corporate.html"><span>Corporate</span><svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg></a>
    <a href="ux-design.html"><span>UX/Design</span><svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg></a>
    <a href="music.html"><span>Music</span><svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg></a>
    <a href="somatic-therapy.html"><span>Somatic Therapy</span><svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg></a>
  </nav>
    <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Toggle menu">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>

</header>

<script>
  (function () {
    var btn = document.getElementById('menu-toggle');
    var nav = document.querySelector('header nav');
    if (btn && nav) {
      btn.addEventListener('click', function () {
        nav.classList.toggle('open');
        btn.classList.toggle('open');
      });
    }
  })();
</script>



<div class="piece-nav">
  <a class="back-link" href="paintings.html">← All paintings</a>
</div>

<main class="piece">
  <div class="piece-image">
    <img id="piece-thumb" src="images/paintings/painting-2020-150x100-b.jpg" alt="Untitled painting, 2020">
  </div>

  <div class="piece-header">
    <div class="meta">2020 · Acrylics on canvas · 150 × 100 cm</div>
    <div class="divider"></div>
  </div>


  <div class="photoset-wrap">
    <button class="photoset-nav prev" type="button" aria-label="Scroll left"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></svg></button>



    <div class="photoset">
    <img class="zoomable" src="images/paintings/painting-2020-150x100-b-thumb1.jpg" alt="Untitled installation view, 2020">
    </div>
    <button class="photoset-nav next" type="button" aria-label="Scroll right"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg></button>
  </div>

  <div class="like-comments">
    <div class="like-bar">
      <button class="like-btn" id="like-btn" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        <span id="like-count">0</span>
      </button>
    </div>
    <div class="comments">
      <div class="comments-title">Comments</div>
      <form class="comment-form" id="comment-form">
        <textarea placeholder="Add a comment…" required></textarea>
        <button type="submit">Post</button>
      </form>
      <div class="comment-list" id="comment-list">
        <p class="comment-empty">No comments yet.</p>
      </div>
    </div>
  </div>
</main>

<div class="lightbox" id="lightbox">
  <img id="lightbox-img" src="images/paintings/painting-2020-150x100-b.jpg" alt="Enlarged view of the artwork">
</div>

<footer id="contact">
  <p>Find more work on <a href="https://www.instagram.com/piotr_szlachta/" target="_blank" rel="noopener">Instagram @piotr_szlachta</a></p>
  <p style="margin-top: 0.5rem;">© 2026 Piotr Szlachta</p>
</footer>

<script>
  const thumb = document.getElementById('piece-thumb');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img') || lightbox.querySelector('img');
  thumb.addEventListener('click', () => { lightboxImg.src = thumb.src; lightbox.classList.add('open'); });
  document.querySelectorAll('.photoset .zoomable').forEach((img) => {
    img.addEventListener('click', () => { lightboxImg.src = img.src; lightbox.classList.add('open'); });
  });
  lightbox.addEventListener('click', () => lightbox.classList.remove('open'));

  const likeBtn = document.getElementById('like-btn');
  const likeCount = document.getElementById('like-count');
  let liked = false;
  likeBtn.addEventListener('click', () => {
    liked = !liked;
    likeBtn.classList.toggle('liked', liked);
    likeCount.textContent = liked ? '1' : '0';
  });

  const commentForm = document.getElementById('comment-form');
  const commentList = document.getElementById('comment-list');
  commentForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const textarea = commentForm.querySelector('textarea');
    const text = textarea.value.trim();
    if (!text) return;
    const empty = commentList.querySelector('.comment-empty');
    if (empty) empty.remove();
    const item = document.createElement('div');
    item.className = 'comment-item';
    item.textContent = text;
    commentList.appendChild(item);
    textarea.value = '';
  });

</script>

<script>
  // carousel-init

  (function () {
    var mainImgs = [];
    var pieceThumb = document.getElementById('piece-thumb');
    if (pieceThumb) mainImgs.push(pieceThumb);
    var heroImg = document.querySelector('.poster-hero img, .piece-image img');
    if (heroImg && mainImgs.indexOf(heroImg) === -1) mainImgs.push(heroImg);
    var setImgs = Array.from(document.querySelectorAll('.photoset .zoomable'));
    var allImgs = mainImgs.concat(setImgs.filter(function (i) { return mainImgs.indexOf(i) === -1; }));
    var lb = document.getElementById('lightbox');
    var lbImg = document.getElementById('lightbox-img') || (lb && lb.querySelector('img'));
    var current = 0;

    function showAt(i) {
      if (!allImgs.length) return;
      current = (i + allImgs.length) % allImgs.length;
      lbImg.src = allImgs[current].src;
      lbImg.alt = allImgs[current].alt;
    }

    allImgs.forEach(function (img, i) {
      img.addEventListener('click', function () { current = i; });
    });

    if (lb) {
      var prevBtn = document.createElement('button');
      prevBtn.className = 'lightbox-nav prev';
      prevBtn.type = 'button';
      prevBtn.setAttribute('aria-label', 'Previous image');
      prevBtn.innerHTML = '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></svg>';
      var nextBtn = document.createElement('button');
      nextBtn.className = 'lightbox-nav next';
      nextBtn.type = 'button';
      nextBtn.setAttribute('aria-label', 'Next image');
      nextBtn.innerHTML = '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>';
      if (allImgs.length > 1) {
        lb.appendChild(prevBtn);
        lb.appendChild(nextBtn);
      }
      prevBtn.addEventListener('click', function (e) { e.stopPropagation(); showAt(current - 1); });
      nextBtn.addEventListener('click', function (e) { e.stopPropagation(); showAt(current + 1); });
      document.addEventListener('keydown', function (e) {
        if (!lb.classList.contains('open')) return;
        if (e.key === 'ArrowLeft') showAt(current - 1);
        if (e.key === 'ArrowRight') showAt(current + 1);
      });
    }

    document.querySelectorAll('.photoset-wrap').forEach(function (wrap) {
      var track = wrap.querySelector('.photoset');
      var prev = wrap.querySelector('.photoset-nav.prev');
      var next = wrap.querySelector('.photoset-nav.next');
      if (!track || !prev || !next) return;
      var step = function () {
        var img = track.querySelector('img');
        return img ? img.offsetWidth + 10 : 150;
      };
      prev.addEventListener('click', function () { track.scrollBy({ left: -step(), behavior: 'smooth' }); });
      next.addEventListener('click', function () { track.scrollBy({ left: step(), behavior: 'smooth' }); });
    });
  })();
</script>

</body>
